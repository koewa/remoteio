<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteIO</title>
    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/server/server.css">
    <link rel="stylesheet" href="/process/process.css">
    <link rel="stylesheet" href="/todo/todo.css">
</head>
<body>
    <h1>RemoteIO</h1>
    <div class="meta">
        <span id="count">processes: --</span>
        <span id="status">status: connecting</span>
        <button class="shutdown-btn" id="shutdownBtn" disabled>Shutdown Server</button>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="processes">Processes</button>
        <button class="tab" data-tab="todo">Todo</button>
    </div>

    <div id="panel-processes" class="panel active"></div>
    <div id="panel-todo" class="panel"></div>

    <script type="module" src="/app.js"></script>
</body>
</html>
