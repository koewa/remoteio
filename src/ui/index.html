<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteIO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117; color: #c9d1d9; padding: 20px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 16px; color: #58a6ff; }
        .meta { display: flex; gap: 16px; margin-bottom: 12px; font-size: 0.85rem; color: #8b949e; align-items: center; }
        .meta span { background: #161b22; padding: 4px 10px; border-radius: 6px; }
        .shutdown-btn {
            margin-left: auto; padding: 4px 14px; font-size: 0.8rem;
            background: #da3633; color: #fff; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 600;
        }
        .shutdown-btn:hover { background: #f85149; }
        .shutdown-btn:disabled { background: #484f58; cursor: default; }

        .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid #30363d; }
        .tab {
            padding: 8px 20px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
            color: #8b949e; border-bottom: 2px solid transparent; background: none; border-top: none;
            border-left: none; border-right: none; transition: 0.15s;
        }
        .tab:hover { color: #c9d1d9; }
        .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .panel { display: none; }
        .panel.active { display: block; }

        .table-wrap { overflow-x: auto; }
        table {
            width: 100%; border-collapse: collapse; font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
        }
        th {
            position: sticky; top: 0; background: #161b22; text-align: left;
            padding: 8px 10px; border-bottom: 2px solid #30363d;
            color: #8b949e; font-weight: 600; cursor: pointer; user-select: none;
        }
        th:hover { color: #58a6ff; }
        th.sorted { color: #58a6ff; }
        td { padding: 4px 10px; border-bottom: 1px solid #21262d; white-space: nowrap; }
        tr:hover td { background: #161b22; }
        .pid { color: #58a6ff; font-weight: 600; }
        .state {
            display: inline-block; padding: 1px 6px; border-radius: 4px;
            font-size: 0.75rem; font-weight: 600;
        }
        .state-R { background: #1f6f2b; color: #7ee787; }
        .state-S { background: #1f6f2b44; color: #7ee787; }
        .state-D { background: #9e6a0344; color: #d29922; }
        .state-Z { background: #da363344; color: #ff7b72; }
        .state-T { background: #8b949e44; color: #8b949e; }
        .cmdline { max-width: 400px; overflow: hidden; text-overflow: ellipsis; }
        .rss { text-align: right; }
        .cpu { text-align: right; }

        .todo-input { display: flex; gap: 8px; margin-bottom: 16px; }
        .todo-input input {
            flex: 1; max-width: 400px; padding: 8px 12px;
            background: #161b22; border: 1px solid #30363d; border-radius: 6px;
            color: #c9d1d9; font-size: 0.9rem; outline: none;
        }
        .todo-input input:focus { border-color: #58a6ff; }
        .todo-input button {
            padding: 8px 18px; font-size: 0.85rem; font-weight: 600;
            background: #238636; color: #fff; border: none; border-radius: 6px; cursor: pointer;
        }
        .todo-input button:hover { background: #2ea043; }

        .todo-list { list-style: none; max-width: 500px; }
        .todo-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-bottom: 1px solid #21262d;
        }
        .todo-item:hover { background: #161b22; border-radius: 6px; }
        .todo-text { flex: 1; font-size: 0.9rem; }
        .todo-remove {
            padding: 2px 8px; font-size: 0.8rem;
            background: transparent; color: #da3633; border: 1px solid #da3633;
            border-radius: 4px; cursor: pointer; font-weight: 600;
        }
        .todo-remove:hover { background: #da3633; color: #fff; }
        .todo-empty { color: #8b949e; font-size: 0.9rem; padding: 20px 0; }
        .connecting { color: #8b949e; padding: 20px; text-align: center; }

        @media (max-width: 600px) {
            .cmdline { max-width: 120px; }
            th, td { padding: 4px 6px; }
        }
    </style>
</head>
<body>
    <h1>RemoteIO</h1>
    <div class="meta">
        <span id="count">processes: --</span>
        <span id="status">status: connecting</span>
        <button class="shutdown-btn" id="shutdownBtn" disabled>Shutdown Server</button>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="processes">Processes</button>
        <button class="tab" data-tab="todo">Todo</button>
    </div>

    <div id="panel-processes" class="panel active">
        <div class="search" style="margin-bottom:12px;">
            <input type="text" id="filter" placeholder="Filter by name, pid, or user..."
                   style="width:100%;max-width:320px;padding:6px 12px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:0.85rem;outline:none;">
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th data-col="pid">PID</th>
                        <th data-col="name">Name</th>
                        <th data-col="state">State</th>
                        <th data-col="uid">User</th>
                        <th data-col="rss" class="rss">RSS</th>
                        <th data-col="cpu" class="cpu">CPU Time</th>
                        <th data-col="cmdline">Command</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div id="connecting" class="connecting">Connecting to server...</div>
    </div>

    <div id="panel-todo" class="panel">
        <div class="todo-input">
            <input type="text" id="todoInput" placeholder="Add a task..." maxlength="200">
            <button id="todoAddBtn">Add</button>
        </div>
        <ul id="todoList" class="todo-list"></ul>
    </div>

    <script>
        const tbody = document.getElementById("tbody");
        const countEl = document.getElementById("count");
        const statusEl = document.getElementById("status");
        const connectingEl = document.getElementById("connecting");
        const filterInput = document.getElementById("filter");
        const shutdownBtn = document.getElementById("shutdownBtn");
        const todoInput = document.getElementById("todoInput");
        const todoAddBtn = document.getElementById("todoAddBtn");
        const todoList = document.getElementById("todoList");

        let socket;
        let processes = [];
        let todos = [];
        let sortCol = "pid";
        let sortDir = 1;

        // ---- tabs ----
        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
                tab.classList.add("active");
                document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
            });
        });

        // ---- process rendering ----
        function fmtBytes(kb) {
            if (kb >= 1048576) return (kb / 1048576).toFixed(1) + " GB";
            if (kb >= 1024) return (kb / 1024).toFixed(1) + " MB";
            return kb + " KB";
        }

        function fmtCpu(sec) {
            if (sec >= 3600) return (sec / 3600).toFixed(1) + "h";
            if (sec >= 60) return (sec / 60).toFixed(1) + "m";
            return sec.toFixed(1) + "s";
        }

        function stateClass(s) {
            const cls = { "R": "state-R", "S": "state-S", "D": "state-D",
                          "Z": "state-Z", "T": "state-T" };
            return cls[s] || "";
        }

        function stateLabel(s) {
            const map = { "R": "running", "S": "sleeping", "D": "disk sleep",
                          "Z": "zombie", "T": "stopped" };
            return map[s] || s;
        }

        function renderProcesses() {
            const q = filterInput.value.toLowerCase();
            const filtered = processes.filter(p =>
                p.pid.toString().includes(q) ||
                p.name.toLowerCase().includes(q) ||
                p.uid.toString().includes(q)
            );

            const sorted = [...filtered].sort((a, b) => {
                let va = a[sortCol], vb = b[sortCol];
                if (typeof va === "string") va = va.toLowerCase();
                if (typeof vb === "string") vb = vb.toLowerCase();
                if (va < vb) return -sortDir;
                if (va > vb) return sortDir;
                return 0;
            });

            let html = "";
            for (const p of sorted) {
                html += `<tr>
                    <td class="pid">${esc(p.pid)}</td>
                    <td>${esc(p.name)}</td>
                    <td><span class="state ${stateClass(p.state)}">${stateLabel(p.state)}</span></td>
                    <td>${p.uid}</td>
                    <td class="rss">${fmtBytes(p.rss_kb)}</td>
                    <td class="cpu">${fmtCpu(p.cpu_time_sec)}</td>
                    <td class="cmdline" title="${esc(p.cmdline)}">${esc(p.cmdline)}</td>
                </tr>`;
            }
            tbody.innerHTML = html;
            countEl.textContent = `processes: ${processes.length}`;
        }

        function esc(s) {
            const d = document.createElement("div");
            d.textContent = s;
            return d.innerHTML;
        }

        document.querySelectorAll("th[data-col]").forEach(th => {
            th.addEventListener("click", () => {
                const col = th.dataset.col;
                if (sortCol === col) sortDir *= -1;
                else { sortCol = col; sortDir = 1; }
                document.querySelectorAll("th.sorted").forEach(t => t.classList.remove("sorted"));
                th.classList.add("sorted");
                th.textContent = th.textContent.replace(/ [▴▾]/, "");
                th.textContent += sortDir === 1 ? " ▴" : " ▾";
                renderProcesses();
            });
        });

        filterInput.addEventListener("input", renderProcesses);

        // ---- todo rendering ----
        function renderTodos() {
            if (todos.length === 0) {
                todoList.innerHTML = '<li class="todo-empty">No tasks yet. Add one above.</li>';
                return;
            }
            let html = "";
            for (let i = 0; i < todos.length; i++) {
                html += `<li class="todo-item">
                    <span class="todo-text">${esc(todos[i])}</span>
                    <button class="todo-remove" data-id="${i}">✕</button>
                </li>`;
            }
            todoList.innerHTML = html;
            todoList.querySelectorAll(".todo-remove").forEach(btn => {
                btn.addEventListener("click", () => {
                    const id = parseInt(btn.dataset.id);
                    socket.send(JSON.stringify({type: "todo_remove", id}));
                });
            });
        }

        todoAddBtn.addEventListener("click", () => {
            const text = todoInput.value.trim();
            if (text) {
                socket.send(JSON.stringify({type: "todo_add", text}));
                todoInput.value = "";
                todoInput.focus();
            }
        });

        todoInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") todoAddBtn.click();
        });

        // ---- websocket ----
        shutdownBtn.addEventListener("click", function() {
            if (confirm("Are you sure you want to shut down the server?")) {
                socket.send(JSON.stringify({type: "shutdown"}));
                this.disabled = true;
                this.textContent = "Shutting down...";
            }
        });

        function connect() {
            socket = new WebSocket("ws://" + window.location.host + "/ws");

            socket.onopen = () => {
                statusEl.textContent = "status: connected";
                connectingEl.style.display = "none";
                shutdownBtn.disabled = false;
                shutdownBtn.textContent = "Shutdown Server";
            };

            socket.onmessage = (event) => {
                const msg = event.data;
                if (msg === "Server shutting down...") {
                    shutdownBtn.disabled = true;
                    shutdownBtn.textContent = "Server offline";
                    return;
                }
                try {
                    const data = JSON.parse(msg);
                    if (Array.isArray(data)) {
                        processes = data;
                        renderProcesses();
                    } else if (data.type === "todo_list") {
                        todos = data.items || [];
                        renderTodos();
                    }
                } catch (_) {}
            };

            socket.onclose = () => {
                statusEl.textContent = "status: disconnected";
                connectingEl.textContent = "Reconnecting in 3 seconds...";
                connectingEl.style.display = "block";
                shutdownBtn.disabled = true;
                shutdownBtn.textContent = "Server offline";
                processes = [];
                renderProcesses();
                setTimeout(connect, 3000);
            };

            socket.onerror = () => {
                statusEl.textContent = "status: error";
            };
        }

        connect();
    </script>
</body>
</html>
